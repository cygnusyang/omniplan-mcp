[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-omniplan-jtr"
version = "0.4.5"
description = "MCP server that lets Claude (and other LLM agents) drive OmniPlan 4 on macOS via the omniJS bridge."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "John Randall", email = "john@johnrandall.com" }]
requires-python = ">=3.11"
dependencies = ["mcp[cli]<2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/johntrandall/omniplan-mcp"
Issues = "https://github.com/johntrandall/omniplan-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mcp-omniplan-jtr = "omniplan_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "requires_omniplan: integration test that needs OmniPlan running with a document open",
]
